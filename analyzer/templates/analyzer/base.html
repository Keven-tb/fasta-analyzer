<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Analisador de FASTA</title>
    <style>
        body { font-family: sans-serif; max-width: 700px; margin: 40px auto; padding: 0 20px; }
        nav a { margin-right: 15px; }
        .mensagem { padding: 10px; margin: 10px 0; border-radius: 4px; }
        .mensagem.success { background: #d4edda; color: #155724; }
        .mensagem.error { background: #f8d7da; color: #721c24; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { text-align: left; padding: 8px; border-bottom: 1px solid #ddd; }
        code { word-break: break-all; }
    </style>
</head>
<body>
    <nav>
        <a href="{% url 'upload_fasta' %}">Enviar FASTA</a>
        <a href="{% url 'listar_sequencias' %}">Ver sequências</a>
    </nav>
    <hr>

    {% for mensagem in messages %}
        <div class="mensagem {{ mensagem.tags }}">{{ mensagem }}</div>
    {% endfor %}

    {% block conteudo %}{% endblock %}
</body>
</html>
