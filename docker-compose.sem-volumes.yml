services:
  db:
    image: postgres:16-alpine
    container_name: fasta-db-efemero
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  django:
    build: .
    container_name: fasta-django-efemero
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000
    environment:
      DEBUG: ${DEBUG}
      SECRET_KEY: ${SECRET_KEY}
      DB_ENGINE: postgres
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      MEDIA_ROOT: /app/media
    depends_on:
      db:
        condition: service_healthy

  nginx:
    build: ./nginx
    container_name: fasta-nginx-efemero
    ports:
      - "8081:80"
    depends_on:
      - django
